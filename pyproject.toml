[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "isaac-pathcover"
version = "0.1.0"
description = "Native Python SUPER with PathCover/RISP corridors on Isaac Lab / Newton"
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = "BSD-3-Clause AND MIT AND LGPL-3.0-or-later"
license-files = ["LICENSE", "licenses/*.txt"]
dependencies = ["numpy==2.5.1", "scipy==1.17.0", "numba==0.68.1", "torch==2.11.0"]

[project.optional-dependencies]
simulation = [
    # Component versions from the single Isaac Lab v3.0.0 source commit.
    "isaaclab==28.0.0",
    "isaaclab-newton==9.1.4",
    "isaaclab-contrib==3.2.0",
    "isaaclab-physx==8.0.0",
    # Observed FlightEnv runtime closure; NumPy/SciPy/PyTorch are in base.
    "charset-normalizer==3.3.2",
    "farama-notifications==0.0.6",
    "filelock==3.25.2",
    "glfw==2.10.0",
    "gymnasium==1.3.0",
    "lazy-loader==0.5",
    "mujoco==3.12.0",
    "mujoco-warp==3.12.0",
    "newton==1.6.1",
    "newton-usd-schemas==0.5.0",
    "packaging==26.0",
    "prettytable==3.18.0",
    "rich==14.3.4",
    "tqdm==4.70.0",
    "typing-extensions==4.16.0",
    "usd-exchange==3.0.1",
    "warp-lang==1.17.0",
    "plotly>=6",
]
test = ["pytest>=8"]

[project.scripts]
isaac-pathcover = "isaac_pathcover.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
isaac_pathcover = ["dynamics/*.json", "simulation/scenes/*.npz", "simulation/scenes/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv]
index-strategy = "unsafe-best-match"

[tool.uv.sources]
isaaclab = { path = ".runtime/isaaclab/source/isaaclab", editable = true }
isaaclab-newton = { path = ".runtime/isaaclab/source/isaaclab_newton", editable = true }
isaaclab-contrib = { path = ".runtime/isaaclab/source/isaaclab_contrib", editable = true }
isaaclab-physx = { path = ".runtime/isaaclab/source/isaaclab_physx", editable = true }
torch = { index = "pytorch-cu130" }
